# Generated by engineering-professor. This workflow is formative feedback.
# Do not use a student-editable workflow as the sole final grading authority.
name: Academic Evaluation Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup 1
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: AC-01 - Instalación limpia y build completan.
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json && (test -f package-lock.json || test -f pnpm-lock.yaml || test -f yarn.lock) && npm run build --if-present
      - name: AC-02 - Los artefactos declarados para la actividad existen.
        shell: bash
        run: |
          set -euo pipefail
          test -e 'docs/requirements.md' && test -e 'docs/decision-record.md' && test -e 'package.json' && test -e 'package-lock.json' && test -e 'scripts/verify.mjs'
      - name: AC-03 - Existe una suite ejecutable de pruebas.
        shell: bash
        run: |
          set -euo pipefail
          test -d tests && find tests -type f -print -quit | grep -q . && npm run test --if-present -- --run
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w01-contexto-setup
          if-no-files-found: ignore
          path: |
            evaluation-result.json
            coverage/
            test-results/
