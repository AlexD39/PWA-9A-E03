name: Starter Semana 1 — feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verificar estructura
        run: npm run verify
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar aplicación
        run: npm run build
      - name: Check público
        run: bash public-tests/check.sh
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-week-01-evidence
          if-no-files-found: ignore
          path: reports/verification.json

