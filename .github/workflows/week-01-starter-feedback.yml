name: Starter Semana 1 — feedback
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'
          cache: npm
      - name: Instalación reproducible
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Estructura, prueba y build
        run: npm run verify
      - name: Guardar evidencia técnica y documentos para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-week-01-evidence
          if-no-files-found: warn
          path: reports/verification.json
